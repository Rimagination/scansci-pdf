name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # One failing combination must not cancel the other eight: a red
      # macOS-only job is otherwise indistinguishable from a red build.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # camoufox and cloakbrowser are optional extras, but the backend
          # selection/launch tests import them and fail with
          # ModuleNotFoundError when they are absent. Neither extra downloads
          # a browser, so this stays cheap.
          pip install -e ".[dev,vpnsci,fast,camoufox,cloakbrowser]"

      - name: Run tests
        run: pytest tests/ -v --tb=short
