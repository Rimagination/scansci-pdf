name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # One failing combination must not cancel the other eight: a red
      # macOS-only job is otherwise indistinguishable from a red build.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # camoufox and cloakbrowser are optional extras, but the backend
          # selection/launch tests import them and fail with
          # ModuleNotFoundError when they are absent. Neither extra downloads
          # a browser, so this stays cheap.
          pip install -e ".[dev,vpnsci,fast,camoufox,cloakbrowser]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # The Qoder plugin bundle ships generated copies of the skills; a stale copy
  # would be submitted to the marketplace as-is, so fail the pull request here.
  # The same check asserts the manifest version matches pyproject.toml; the
  # manual "Qoder release check" workflow verifies that version is actually on
  # PyPI and exposes --profile before the ZIP is submitted.
  qoder-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify generated skills are in sync
        run: node qoder-plugin/scripts/sync-skills.mjs --check
